<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pass the Bomb</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#14181d;--ink:#f2efe6;--amber:#ffb020;--red:#ff2a1a;--steel:#8b95a1}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;height:100vh}
#left{padding:4vh 3vw;display:flex;flex-direction:column;min-height:0;background:radial-gradient(circle at 20% 0,#1d232b,var(--panel) 70%);border-right:2px solid #000}
#round{color:var(--steel);font-size:max(14px,1.6vh);letter-spacing:.04em}
#qBox{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center}
#qText{font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;line-height:1.15;margin:0;overflow-wrap:anywhere}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1vw}
.ch{display:flex;gap:.8vw;align-items:center;font-family:'Atkinson Hyperlegible';font-size:max(16px,3vh);padding:1.2vh 1vw;background:#1c222a;border-left:4px solid var(--amber);border-radius:4px}
.ch b{color:var(--amber)}
#right{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a1d1a,#0a0b0d 75%)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%}
#led{position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:min(16vh,12vw);color:var(--red);background:#1a0504;padding:0 .3em;border:3px solid #3a0c08;border-radius:8px;text-shadow:0 0 .25em #f20,0 0 .6em #a10;line-height:1.1}
#led.hot{animation:pl .5s infinite}@keyframes pl{50%{filter:brightness(1.6)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#boom{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;pointer-events:none}
#boom h1{font-size:min(22vh,16vw);margin:0;color:#ffd24a;text-shadow:0 0 .2em #f60,0 .04em 0 #a00;animation:bm 1.8s forwards}
@keyframes bm{0%{transform:scale(.2) rotate(-8deg);opacity:0}15%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
#boom button{pointer-events:auto;font-size:3vh}
#bar{grid-column:1/3;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#07080a;border-top:1px solid #2a2f36}
#bar.hide{display:none}
button{font:inherit;font-weight:700;color:var(--ink);background:#262c34;border:1px solid #3a424c;border-radius:6px;padding:10px 16px;cursor:pointer}
button:hover{background:#323a44}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber)}
button.go{background:var(--amber);color:#1a1000;border-color:var(--amber)}button:disabled{opacity:.4;cursor:default}
label{color:var(--steel);display:flex;gap:8px;align-items:center}.sp{flex:1}
#mgr{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
#mgr .box{width:min(900px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #3a424c;border-radius:10px;padding:20px}
.row{display:flex;gap:6px;margin:6px 0}.row input{flex:1;font:inherit;font-family:'Atkinson Hyperlegible';padding:8px;background:#0d0f12;color:var(--ink);border:1px solid #3a424c;border-radius:6px}
.row.cur input{border-color:var(--amber)}textarea{width:100%;height:110px;background:#0d0f12;color:var(--ink);border:1px solid #3a424c;border-radius:6px;padding:8px;font:inherit}
small{color:var(--steel)}
</style></head><body>
<div id="app">
 <section id="left"><div id="round"></div><div id="qBox"><h2 id="qText"></h2></div><div id="choices"></div></section>
 <section id="right"><canvas id="gl"></canvas><div id="led">07</div><div id="flash"></div>
  <div id="boom"><h1>BOOM!</h1><button class="go" id="bRestart">RESTART</button></div></section>
 <div id="bar">
  <button class="go" id="bStart">START ROUND</button><button id="bReset">RESET ROUND</button><button id="bNext">NEXT QUESTION</button><button id="bEdit">EDIT QUESTION</button>
  <span class="sp"></span>
  <button id="bSnd">SOUND ON</button><label>VOLUME <input type="range" id="vol" min="0" max="1" step=".01" value=".7"></label><button id="bFs">FULLSCREEN</button>
  <small>Space start · R reset · N next · E edit · M mute · F fullscreen · H hide bar</small>
 </div>
</div>
<div id="mgr"><div class="box">
 <h3 style="margin-top:0">Question list</h3>
 <small>Optional answer choices: Question | choice A | choice B | choice C. Click a number to jump to that question.</small>
 <div id="list"></div>
 <p><button id="mAdd">+ Add question</button></p>
 <small>Import: one question per line</small>
 <textarea id="imp" placeholder="Paste a list of questions here"></textarea>
 <p><button id="mApp">Import (add to list)</button> <button id="mRep">Import (replace list)</button> <button class="go" id="mDone" style="float:right">Done</button></p>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),LS='ptb.questions.v1';
const DEF=['What did you do yesterday?','Name three animals.','What are you wearing today?','Make a sentence using the past simple.','Name five things in the classroom.'];
let Q=null;try{Q=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!Array.isArray(Q)||!Q.length)Q=DEF.slice();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(Q))}catch(e){}};
let idx=0,state='idle',t0=0,ti=0,pulse=0,tb=0,lastLed=-1,last=performance.now();
const TICKS=[0,1000,2000,3000,4000,4500,5000,5400,5800,6100,6400,6650,6850];

/* ---------- questions ---------- */
function renderQ(){
 const p=Q[idx].split('|').map(s=>s.trim()),q=p[0],ch=p.slice(1).filter(Boolean);
 $('#qText').textContent=q||'(empty question)';const c=$('#choices');c.innerHTML='';
 ch.slice(0,6).forEach((t,i)=>{const d=document.createElement('div');d.className='ch';d.innerHTML='<b>'+'ABCDEF'[i]+'</b><span></span>';d.lastChild.textContent=t;c.appendChild(d)});
 $('#round').textContent='Question '+(idx+1)+' of '+Q.length;fit();
}
function fit(){let s=Math.min(innerHeight*.11,innerWidth*.05);const e=$('#qText'),b=$('#qBox');e.style.fontSize=s+'px';
 while(b.scrollHeight>b.clientHeight&&s>16){s-=2;e.style.fontSize=s+'px'}}
function renderList(focus){
 const L=$('#list');L.innerHTML='';
 Q.forEach((q,i)=>{const r=document.createElement('div');r.className='row'+(i==idx?' cur':'');
  const n=document.createElement('button');n.textContent=i+1;n.onclick=()=>{idx=i;resetRound();renderQ();renderList()};
  const inp=document.createElement('input');inp.value=q;inp.oninput=()=>{Q[i]=inp.value;save();if(i==idx)renderQ()};
  const mk=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;return b};
  const mv=d=>()=>{const j=i+d;if(j<0||j>=Q.length)return;[Q[i],Q[j]]=[Q[j],Q[i]];if(idx==i)idx=j;else if(idx==j)idx=i;save();renderQ();renderList()};
  r.append(n,inp,mk('↑',mv(-1)),mk('↓',mv(1)),mk('Delete',()=>{if(Q.length<2)return;Q.splice(i,1);if(idx>=Q.length)idx=Q.length-1;else if(i<idx)idx--;save();renderQ();renderList()}));
  L.appendChild(r);if(focus&&i==idx)setTimeout(()=>inp.focus(),0)});
}
const imp=rep=>{const l=$('#imp').value.split('\n').map(s=>s.replace(/^\s*(\d+[.)]|[-*•])\s*/,'').trim()).filter(Boolean);
 if(!l.length)return;Q=rep?l:Q.concat(l);if(rep)idx=0;save();$('#imp').value='';renderQ();renderList()};
function openMgr(){$('#mgr').style.display='flex';renderList(true)}
$('#mAdd').onclick=()=>{Q.push('New question');save();renderList();renderQ()};
$('#mApp').onclick=()=>imp(false);$('#mRep').onclick=()=>imp(true);
$('#mDone').onclick=()=>{$('#mgr').style.display='none'};

/* ---------- audio (synthesized) ---------- */
let AC,master,comp,bus,rv,irBuf,noiseBuf,vol=.7,muted=false;
function initAudio(){
 if(AC){AC.resume();return}
 AC=new(window.AudioContext||window.webkitAudioContext)();comp=AC.createDynamicsCompressor();master=AC.createGain();master.connect(comp);comp.connect(AC.destination);setVol();
 const n=AC.sampleRate*2.6|0;irBuf=AC.createBuffer(2,n,AC.sampleRate);
 for(let c=0;c<2;c++){const d=irBuf.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
 noiseBuf=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function setVol(){if(master)master.gain.setTargetAtTime(muted?0:vol*vol,AC.currentTime,.02)}
function newBus(){if(!AC)return;killBus();bus=AC.createGain();bus.connect(master);rv=AC.createConvolver();rv.buffer=irBuf;rv.connect(bus)}
function killBus(){if(!bus)return;const b=bus;b.gain.setTargetAtTime(0,AC.currentTime,.03);setTimeout(()=>b.disconnect(),400);bus=null}
function env(g,t,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function tick(i){if(!bus)return;const t=AC.currentTime,f=1100+i*70;
 const o=AC.createOscillator(),g=AC.createGain(),bp=AC.createBiquadFilter();o.type='square';o.frequency.value=f;bp.type='bandpass';bp.frequency.value=f;env(g,t,.3,.07);o.connect(bp);bp.connect(g);g.connect(bus);o.start(t);o.stop(t+.1);
 const o2=AC.createOscillator(),g2=AC.createGain();o2.frequency.setValueAtTime(180,t);o2.frequency.exponentialRampToValueAtTime(70,t+.08);env(g2,t,.5,.1);o2.connect(g2);g2.connect(bus);o2.start(t);o2.stop(t+.12)}
function drone(){const t=AC.currentTime,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
 o.type='sawtooth';o.frequency.setValueAtTime(55,t+4);o.frequency.exponentialRampToValueAtTime(140,t+7);f.type='lowpass';f.frequency.value=500;
 g.gain.setValueAtTime(.0001,t);g.gain.setValueAtTime(.0001,t+4);g.gain.exponentialRampToValueAtTime(.22,t+6.95);g.gain.linearRampToValueAtTime(0,t+7);
 o.connect(f);f.connect(g);g.connect(bus);o.start(t);o.stop(t+7.05)}
function boomSound(){if(!bus)return;const t=AC.currentTime;
 const ns=(dur,fType,f0,f1,peak,decay,wet)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=fType;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.0001,t+decay);s.connect(f);f.connect(g);g.connect(bus);if(wet)g.connect(rv);s.start(t);s.stop(t+decay+.1)};
 ns(1.6,'lowpass',9000,150,1,2.4,true);ns(.05,'highpass',2500,2500,1,.05,false);
 const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(26,t+.9);g.gain.setValueAtTime(1.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(g);g.connect(bus);g.connect(rv);o.start(t);o.stop(t+1.9)}

/* ---------- 3D ---------- */
const pane=$('#right'),R=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=THREE.ACESFilmicToneMapping;R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100),camBase=new THREE.Vector3(0,0,8.2);
const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c};
const scratch=new THREE.CanvasTexture(cv(512,512,(x,w,h)=>{x.fillStyle='#b4b4b4';x.fillRect(0,0,w,h);
 for(let i=0;i<500;i++){x.strokeStyle=Math.random()<.5?'#fff8':'#0006';x.lineWidth=Math.random()*1.5;x.beginPath();const a=Math.random()*w,b=Math.random()*h,l=Math.random()*70;x.moveTo(a,b);x.lineTo(a+l,b+(Math.random()-.5)*8);x.stroke()}
 for(let i=0;i<2500;i++){x.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},0,.08)`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}}));
scratch.wrapS=scratch.wrapT=THREE.RepeatWrapping;scratch.repeat.set(2,1);
const envT=new THREE.CanvasTexture(cv(512,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#667');g.addColorStop(.5,'#222');g.addColorStop(1,'#110c0a');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.fillStyle='#fff';x.fillRect(60,30,120,50);x.fillStyle='#ffc890';x.fillRect(300,50,60,90);x.fillStyle='#6a8cff';x.fillRect(430,40,50,60)}));
envT.mapping=THREE.EquirectangularReflectionMapping;
const steel=new THREE.MeshStandardMaterial({color:0x7d858e,metalness:.92,roughness:.4,roughnessMap:scratch,bumpMap:scratch,bumpScale:1.2,envMap:envT,envMapIntensity:1.2});
const dark=new THREE.MeshStandardMaterial({color:0x2a2f35,metalness:.85,roughness:.5,roughnessMap:scratch,envMap:envT});
const stripe=new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(cv(128,32,(x,w,h)=>{x.fillStyle='#e8b50c';x.fillRect(0,0,w,h);x.fillStyle='#111';for(let i=-2;i<10;i++){x.beginPath();x.moveTo(i*16,0);x.lineTo(i*16+8,0);x.lineTo(i*16+24,h);x.lineTo(i*16+16,h);x.fill()}})),metalness:.5,roughness:.5,envMap:envT});
stripe.map.wrapS=THREE.RepeatWrapping;stripe.map.repeat.set(6,1);
const bomb=new THREE.Group(),add=(m,x,y,z,rz)=>{m.position.set(x,y,z);if(rz)m.rotation.z=rz;bomb.add(m);return m};
const cyl=(r,l,mat,seg=48)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,l,seg),mat);
add(cyl(1.3,3.4,steel,64),0,0,0,Math.PI/2);
[-.75,.75].forEach(x=>add(cyl(1.34,.28,stripe,64),x,0,0,Math.PI/2));
[-1,1].forEach(s=>{add(cyl(1.4,.22,dark,64),s*1.75,0,0,Math.PI/2);
 for(let a=0;a<8;a++){const t=a/8*Math.PI*2;add(cyl(.09,.12,steel,12),s*1.88,Math.cos(t)*1.1,Math.sin(t)*1.1,Math.PI/2)}});
[-.9,.9].forEach(x=>{add(cyl(.28,.6,dark),x,1.55,0);add(cyl(.18,.12,steel,16),x,1.88,0)});
add(cyl(.03,.9,steel,8),1.25,1.7,0);const tip=add(new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),new THREE.MeshBasicMaterial({color:0xff2200})),1.25,2.17,0);
add(new THREE.Mesh(new THREE.BoxGeometry(2.1,1,.2),dark),0,0,1.28);
const ledC=cv(256,128,()=>{}),ledX=ledC.getContext('2d'),ledT=new THREE.CanvasTexture(ledC);
const disp=add(new THREE.Mesh(new THREE.PlaneGeometry(1.9,.85),new THREE.MeshBasicMaterial({map:ledT})),0,0,1.385);
[[0xaa1111,[-.9,1.9,0],[-1.2,1.7,.9],[-1.15,.6,1.4],[-.95,.3,1.38]],[0x1c3fb5,[.9,1.9,0],[1.2,1.6,.9],[1.1,.5,1.4],[.95,.3,1.38]],[0xd1ab12,[-.9,1.9,0],[0,2.3,.6],[.9,1.9,.2],[1.2,.9,1.1],[1.1,.2,1.4]],[0x1a8a3a,[1.9,.3,.9],[1.6,-.3,1.5],[.5,-.5,1.5],[-.95,-.25,1.38]]]
 .forEach(([c,...p])=>bomb.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p.map(v=>new THREE.Vector3(...v))),40,.04,8),new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.1}))));
bomb.rotation.set(.15,-.4,0);bomb.userData.y=.4;S.add(bomb);
S.add(new THREE.AmbientLight(0x6070a0,.35));
const key=new THREE.DirectionalLight(0xffdcb4,2.4);key.position.set(3,4,5);S.add(key);
const rim=new THREE.DirectionalLight(0x5577ff,1.8);rim.position.set(-5,2,-3);S.add(rim);
const redL=new THREE.PointLight(0xff2200,0,8);redL.position.set(0,.2,3);S.add(redL);
const boomL=new THREE.PointLight(0xff8a20,0,20);S.add(boomL);
function resize(){const w=pane.clientWidth,h=pane.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;camBase.z=8.2*Math.max(1,1.1/cam.aspect);cam.updateProjectionMatrix();fit()}
addEventListener('resize',resize);

function setLed(n){if(n===lastLed)return;lastLed=n;const s=String(n).padStart(2,'0');$('#led').textContent=s;
 ledX.fillStyle='#160403';ledX.fillRect(0,0,256,128);ledX.font='bold 110px "Share Tech Mono",monospace';ledX.textAlign='center';ledX.textBaseline='middle';
 ledX.shadowColor='#f20';ledX.shadowBlur=18;ledX.fillStyle='#ff3a22';ledX.fillText(s,128,70);ledX.shadowBlur=0;ledX.font='16px monospace';ledX.fillStyle='#a22';ledX.fillText('ARMED',128,14);ledT.needsUpdate=true}

/* explosion effects */
const glow=new THREE.CanvasTexture(cv(64,64,(x)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.35,'#fffa');g.addColorStop(1,'#fff0');x.fillStyle=g;x.fillRect(0,0,64,64)}));
let fx=[],sparks=null,ring=null,te0=0;
const rnd=(a,b)=>a+Math.random()*(b-a),dir=()=>{const v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1));return v.length()<.01?dir():v.normalize()};
function spawnFx(){
 const o=bomb.position.clone();
 for(let i=0;i<80;i++){const m=new THREE.SpriteMaterial({map:glow,color:new THREE.Color().setHSL(rnd(.02,.12),1,rnd(.45,.6)),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true});
  const s=new THREE.Sprite(m);s.position.copy(o);S.add(s);fx.push({s,v:dir().multiplyScalar(rnd(.8,4)),life:rnd(.8,1.6),g0:rnd(1.2,2.8),grow:rnd(1,2.5),op:1})}
 for(let i=0;i<55;i++){const m=new THREE.SpriteMaterial({map:glow,color:0x2a2622,depthWrite:false,transparent:true});
  const s=new THREE.Sprite(m);s.position.copy(o);S.add(s);fx.push({s,v:dir().multiplyScalar(rnd(.4,2.2)).add(new THREE.Vector3(0,.6,0)),life:rnd(2,3.6),g0:rnd(1.5,3),grow:rnd(1.5,3),op:.65,delay:rnd(.05,.4)})}
 const N=450,p=new Float32Array(N*3),v=[];for(let i=0;i<N;i++){p.set([o.x,o.y,o.z],i*3);v.push(dir().multiplyScalar(rnd(3,11)))}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 sparks=new THREE.Points(g,new THREE.PointsMaterial({color:0xffb040,size:.09,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));sparks.userData.v=v;S.add(sparks);
 ring=new THREE.Mesh(new THREE.RingGeometry(.9,1,64),new THREE.MeshBasicMaterial({color:0xffd9a0,transparent:true,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));ring.position.copy(o);S.add(ring)}
function clearFx(){fx.forEach(f=>{S.remove(f.s);f.s.material.dispose()});fx=[];[sparks,ring].forEach(m=>{if(m){S.remove(m);m.geometry.dispose();m.material.dispose()}});sparks=ring=null;boomL.intensity=0}
function updFx(te,dt){
 fx.forEach(f=>{const t=te-(f.delay||0);if(t<0){f.s.material.opacity=0;return}const k=t/f.life;f.s.position.addScaledVector(f.v,dt);f.v.multiplyScalar(1-1.6*dt);
  f.s.scale.setScalar(f.g0+f.grow*t*2);f.s.material.opacity=Math.max(0,f.op*(1-k)*Math.min(1,t*12))});
 if(sparks){const p=sparks.geometry.attributes.position.array,v=sparks.userData.v;for(let i=0;i<v.length;i++){v[i].y-=6*dt;p[i*3]+=v[i].x*dt;p[i*3+1]+=v[i].y*dt;p[i*3+2]+=v[i].z*dt}sparks.geometry.attributes.position.needsUpdate=true;sparks.material.opacity=Math.max(0,1-te/2)}
 if(ring){const k=Math.min(1,te/.8);ring.scale.setScalar(.5+k*9);ring.material.opacity=(1-k)*.8}
 boomL.position.copy(bomb.position);boomL.intensity=12*Math.exp(-te*3);
 const a=.4*Math.exp(-te*3.5);cam.position.set(camBase.x+rnd(-a,a),camBase.y+rnd(-a,a),camBase.z);
 if(te>.06)bomb.visible=false;
 $('#flash').style.opacity=Math.max(0,.95*Math.exp(-te*7))}

/* ---------- round logic (single rAF loop, one monotonic clock) ---------- */
function startRound(){if(state!=='idle')return;initAudio();newBus();state='run';t0=performance.now();ti=0;if(AC)drone();ui()}
function explode(){state='boom';te0=performance.now();setLed(0);$('#led').classList.remove('hot');spawnFx();boomSound();
 const b=$('#boom'),h=b.querySelector('h1');b.style.display='flex';h.style.animation='none';void h.offsetWidth;h.style.animation='';ui()}
function resetRound(){state='idle';killBus();clearFx();bomb.visible=true;cam.position.copy(camBase);$('#flash').style.opacity=0;$('#boom').style.display='none';
 $('#led').classList.remove('hot');lastLed=-1;setLed(7);pulse=0;ui()}
function nextQ(){idx=(idx+1)%Q.length;resetRound();renderQ()}
function ui(){$('#bStart').disabled=state!=='idle'}
function frame(now){
 requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;tb+=dt;
 let tension=0;
 if(state==='run'){const el=now-t0;
  while(ti<TICKS.length&&el>=TICKS[ti]){tick(ti);pulse=1;ti++}
  const rem=Math.max(0,7-el/1000);setLed(Math.ceil(rem));tension=Math.max(0,(3-rem)/3);
  $('#led').classList.toggle('hot',rem<=3);
  if(el>=7000)explode()}
 pulse=Math.max(0,pulse-dt*4);redL.intensity=pulse*(2+tension*6);tip.material.color.setHex(pulse>.3?0xff5533:0x661100);
 if(state==='boom')updFx((now-te0)/1000,dt);
 else{cam.position.copy(camBase);bomb.position.set(rnd(-1,1)*tension*.03,bomb.userData.y+Math.sin(tb*1.2)*.04+rnd(-1,1)*tension*.03,0)}
 bomb.rotation.y=-.4+Math.sin(tb*.5)*.12;cam.lookAt(0,0,0);R.render(S,cam)}

/* ---------- controls ---------- */
$('#bStart').onclick=startRound;$('#bReset').onclick=resetRound;$('#bRestart').onclick=resetRound;$('#bNext').onclick=nextQ;$('#bEdit').onclick=openMgr;
const snd=()=>{$('#bSnd').textContent=muted?'SOUND OFF':'SOUND ON';setVol()};
$('#bSnd').onclick=()=>{muted=!muted;snd()};$('#vol').oninput=e=>{vol=+e.target.value;setVol()};
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$('#bFs').onclick=fs;
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||$('#mgr').style.display==='flex'||e.ctrlKey||e.metaKey)return;
 const k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();startRound()}else if(k==='r')resetRound();else if(k==='n')nextQ();else if(k==='e'){e.preventDefault();openMgr()}
 else if(k==='m'){muted=!muted;snd()}else if(k==='f')fs();else if(k==='h')$('#bar').classList.toggle('hide');resize()});
renderQ();resetRound();resize();requestAnimationFrame(frame);
</script></body></html>
