<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#status{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:24px;font-size:clamp(12px,1.3vw,22px);letter-spacing:.25em;color:var(--red);text-transform:uppercase}
#big{position:fixed;top:3vh;left:0;right:0;text-align:center;font:900 15vh "Courier New",monospace;color:var(--red);text-shadow:0 0 30px #f20,0 0 80px #a00;opacity:0;transition:opacity .3s;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;opacity:0;transition:opacity .4s}
#msg h1{margin:0;font:900 24vh Impact,"Arial Black",sans-serif;color:#ffb347;text-shadow:0 0 40px #ff5a00,0 0 120px #c20;letter-spacing:.04em}
#msg p{margin:2vh 0;font-size:5vh;letter-spacing:.2em;font-weight:700}
#msg button{pointer-events:auto}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;transition:opacity .4s}
#bar.dim{opacity:.18}#bar.dim:hover{opacity:1}
button,.box{font:700 clamp(15px,1.6vw,26px) "Segoe UI",Arial,sans-serif;letter-spacing:.15em;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:.7em 1.3em;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:var(--red)}button:active{transform:scale(.97)}
#start,#restart{background:var(--red);border-color:var(--red);color:#fff}
.box{display:flex;gap:10px;align-items:center;cursor:default}
input[type=number]{width:3.2em;font:inherit;background:#000;color:var(--red);border:1px solid var(--line);border-radius:6px;text-align:center;padding:.2em}
input[type=range]{accent-color:var(--red);width:9vw;min-width:90px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:var(--bg);padding:30px;font-size:22px}
</style></head><body>
<canvas id="c"></canvas>
<div id="status">Ready</div><div id="big"></div>
<div id="msg"><h1>BOOM!</h1><p id="next" style="opacity:0">PASS THE BOMB — NEXT ROUND</p><button id="restart" style="opacity:0">RESTART</button></div>
<div id="bar">
<button id="start">START</button><button id="reset">RESET</button><button id="snd">SOUND ON</button>
<span class="box">VOL <input id="vol" type="range" min="0" max="1" step=".01" value=".7"></span>
<span class="box">SEC <input id="dur" type="number" min="1" max="60" value="7"></span>
<button id="fs">FULLSCREEN</button></div>
<div id="err"></div>

{const s=new THREE.Scene();s.background=new THREE.Color(0x07080a);

 dg.font='bold 18px Arial';dg.textAlign='left';dg.fillText('SEC',14,22);dg.font='bold 140px "Courier New",monospace';dg.textAlign='right';dg.shadowColor='#ff1a0a';dg.shadowBlur=30;dg.fillStyle='#ff4636';dg.fillText(String(n),292,86);dg.shadowBlur=0;

{const c=cv(128,128),g=c.getContext('2d'),q=g.createRadialGradient(64,64,0,64,64,64);q.addColorStop(0,'rgba(120,60,10,.5)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,128,128);

 const mkS=(c,bl)=>{const s=add(new THREE.Sprite(new THREE.SpriteMaterial({map:soft,color:c,transparent:true,depthWrite:false,opacity:0,blending:bl})));s.userData.v=new THREE.Vector3(rnd(-1,1),rnd(-.2,1),rnd(-1,1)).normalize().multiplyScalar(rnd(1.5,5));s.userData.s=rnd(1.2,2.6);return s};
 const fire=[],smoke=[];for(let i=0;i<36;i++)fire.push(mkS(0xff7a1a,THREE.AdditiveBlending));for(let i=0;i<64;i++){const s=mkS(0xff8a30,THREE.NormalBlending);s.userData.d=rnd(.3,.8);s.userData.v.multiplyScalar(.55).y+=rnd(.3,1.4);smoke.push(s)}
 const N=450,P=new Float32Array(N*3),V=new Float32Array(N*3),Cc=new Float32Array(N*3),Lf=new Float32Array(N),Lm=new Float32Array(N);
 for(let i=0;i<N;i++){const d=new THREE.Vector3(rnd(-1,1),rnd(-.4,1),rnd(-1,1)).normalize().multiplyScalar(rnd(4,15));V.set([d.x,d.y,d.z],i*3);Lm[i]=Lf[i]=rnd(.8,2.2);P.set([rnd(-.3,.3),rnd(-.3,.3),rnd(-.3,.3)],i*3)}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(P,3));sg.setAttribute('color',new THREE.BufferAttribute(Cc,3));
 const sparks=add(new THREE.Points(sg,new THREE.PointsMaterial({map:soft,size:.16,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})));sparks.frustumCulled=false;
 const fgm=new THREE.BoxGeometry(.18,.1,.14),frm=new THREE.MeshStandardMaterial({color:0x2a2c30,metalness:.9,roughness:.5}),frs=[];
 for(let i=0;i<28;i++){const m=add(new THREE.Mesh(fgm,frm));m.userData.shared=1;m.scale.setScalar(rnd(.6,2));m.userData.v=new THREE.Vector3(rnd(-1,1),rnd(.3,1.4),rnd(-1,1)).normalize().multiplyScalar(rnd(3,9));m.userData.w=new THREE.Vector3(rnd(-9,9),rnd(-9,9),rnd(-9,9));frs.push(m)}
 X={g,L,flash,fb,r1,r2,fire,smoke,P,V,Cc,Lf,Lm,sparks,frs,t:0,N}}
function updX(dt){const x=X;x.t+=dt;const t=x.t;
 x.flash.material.opacity=Math.max(0,1-t/.4);x.flash.scale.setScalar(4+t*28);
 x.L.intensity=Math.max(0,CONFIG.fire*70*Math.exp(-t*3));
 x.fb.scale.setScalar(.4+(1-Math.exp(-t*5))*3.2);x.fb.material.opacity=Math.max(0,1-t/.9);x.fb.visible=t<.9;
 [x.r1,x.r2].forEach(r=>{r.scale.setScalar(1+t*24);r.material.opacity=Math.max(0,.8-t*1.2);if(r.userData.bb)r.lookAt(cam.position)});
 x.fire.forEach(s=>{const u=s.userData;s.position.addScaledVector(u.v,dt);u.v.multiplyScalar(Math.exp(-2*dt));s.scale.setScalar(u.s*(1+t*2.5));s.material.opacity=Math.max(0,1-t/1.1)*.9});
 x.smoke.forEach(s=>{const u=s.userData,a=Math.max(0,t-u.d*.3);s.position.addScaledVector(u.v,dt);u.v.multiplyScalar(Math.exp(-.8*dt));s.scale.setScalar(u.s*1.4+a*1.6);
  const k=Math.min(1,a/1.2);s.material.color.setRGB(.9-.78*k,.45-.33*k,.12-.0*k+.0).lerp(new THREE.Color(.12,.12,.13),k);s.material.opacity=a<=0?0:Math.min(a*2,1)*Math.max(0,1-a/4.6)*.6});
 const {P,V,Cc,Lf,Lm}=x,dr=Math.exp(-1.6*dt);
 for(let i=0;i<x.N;i++){const j=i*3;Lf[i]-=dt;if(Lf[i]<=0){Cc[j]=Cc[j+1]=Cc[j+2]=0;continue}
  V[j]*=dr;V[j+1]=V[j+1]*dr-9*dt;V[j+2]*=dr;P[j]+=V[j]*dt;P[j+1]+=V[j+1]*dt;P[j+2]+=V[j+2]*dt;if(P[j+1]<-1.28){P[j+1]=-1.28;V[j+1]*=-.3}
  const k=Lf[i]/Lm[i];Cc[j]=Math.sqrt(k);Cc[j+1]=k*.8;Cc[j+2]=k*k*.35}
 x.sparks.geometry.attributes.position.needsUpdate=x.sparks.geometry.attributes.color.needsUpdate=true;
 x.frs.forEach(m=>{const u=m.userData;u.v.y-=9*dt;m.position.addScaledVector(u.v,dt);m.rotation.x+=u.w.x*dt;m.rotation.y+=u.w.y*dt;if(m.position.y<-1.2){m.position.y=-1.2;u.v.multiplyScalar(.35);u.v.y=Math.abs(u.v.y)*.4;u.w.multiplyScalar(.5)}m.visible=t<2.4})}

/* ---------- game state ---------- */
let state='idle',tEnd=0,total=7000,lastN=null,camT=0,drag=false,vib=0;
const status=$('status'),big=$('big'),msg=$('msg'),nextEl=$('next'),rst=$('restart'),bar=$('bar'),durIn=$('dur');
const setStatus=s=>status.textContent=s;
function readDur(){let d=parseFloat(durIn.value);if(!(d>=1))d=CONFIG.duration;d=Math.min(60,Math.max(1,Math.round(d)));durIn.value=d;CONFIG.duration=d;return d}
function start(){if(state!=='idle')return;initAudio();newRun();total=readDur()*1000;tEnd=performance.now()+total;lastN=null;state='countdown';setStatus('Armed — pass it!');big.style.opacity=1;bar.classList.add('dim');sStart();durIn.disabled=true}
function reset(){if(AC)killRun();disposeX();bomb.visible=true;state='idle';lastN=null;camT=0;big.style.opacity=0;msg.style.opacity=0;nextEl.style.opacity=0;rst.style.opacity=0;rst.style.pointerEvents='none';bar.classList.remove('dim');durIn.disabled=false;redL.intensity=0;led(readDur());setStatus('Ready')}
function explode(){state='explosion';big.style.opacity=0;setStatus('Detonated');boom();sBoom();msg.style.opacity=1;X.after=0}
$('start').onclick=start;$('reset').onclick=reset;rst.onclick=reset;
$('snd').onclick=e=>{muted=!muted;e.target.textContent=muted?'SOUND OFF':'SOUND ON';setVol()};
$('vol').oninput=e=>{CONFIG.volume=+e.target.value;setVol()};$('vol').value=CONFIG.volume;
durIn.onchange=()=>{readDur();if(state==='idle')led(CONFIG.duration)};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
addEventListener('keydown',e=>{if(e.target===durIn)return;if(e.code==='Space'){e.preventDefault();start()}if(e.key==='r'||e.key==='R')reset()});
const cvs=$('c');let lx=0;cvs.onpointerdown=e=>{if(state==='idle'){drag=true;lx=e.clientX;cvs.setPointerCapture(e.pointerId)}};cvs.onpointermove=e=>{if(drag){bomb.rotation.y+=(e.clientX-lx)*.008;lx=e.clientX}};cvs.onpointerup=cvs.onpointercancel=()=>drag=false;

/* ---------- camera + loop ---------- */
let fit=1;function resize(){const w=innerWidth,h=innerHeight;R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(w,h,false);cam.aspect=w/h;fit=Math.max(1,1.6/cam.aspect);cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const camA=new THREE.Vector3(4.2,2.0,7.4),camB=new THREE.Vector3(2.3,1.1,5.6),tmp=new THREE.Vector3();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const T=now/1000;let shake=0;
 const dp=dust.geometry.attributes.position;for(let i=0;i<dN;i++){dp.array[i*3+1]+=dt*.05;if(dp.array[i*3+1]>4)dp.array[i*3+1]=-4}dp.needsUpdate=true;
 if(state==='idle'){if(CONFIG.idleSpin&&!drag)bomb.rotation.y+=dt*.25;bomb.position.y=Math.sin(T*55)*.0018}
 else if(state==='countdown'){const rem=tEnd-now;
  if(rem<=0)explode();else{const n=Math.ceil(rem/1000);
   if(n!==lastN){lastN=n;led(n);big.textContent=n;sTick(1-rem/total)}
   const prog=1-rem/total,fr=(rem%1000)/1000;redL.intensity=.5+4*Math.pow(fr,4)*(.6+prog);
   if(rem<2000)sRumble();if(rem<150)sCut();
   const tg=Math.round(bomb.rotation.y/6.2832)*6.2832;bomb.rotation.y+=(tg-bomb.rotation.y)*Math.min(1,dt*4);
   vib=.004*(1+prog*4);bomb.position.set((Math.random()-.5)*vib,(Math.random()-.5)*vib,0);shake=prog*.01}}
 else{bomb.position.set(0,0,0);redL.intensity=0}
 if(X){updX(dt);if(state==='explosion'||state==='complete')shake=.4*CONFIG.shake*Math.exp(-X.t*4.5);
  if(state==='explosion'&&X.t>2.4){state='complete';nextEl.style.opacity=1;rst.style.opacity=1;rst.style.pointerEvents='auto';setStatus('Next round')}
  if(X.t>6.5)disposeX()}
 const target=(state==='idle')?0:1;camT+=(target-camT)*Math.min(1,dt*(target?2.6:6));
 tmp.lerpVectors(camA,camB,camT*camT*(3-2*camT)).multiplyScalar(fit);
 cam.position.set(tmp.x+(Math.random()-.5)*shake,tmp.y+(Math.random()-.5)*shake,tmp.z+(Math.random()-.5)*shake);cam.lookAt(0,-.1,0);
 spot.intensity=CONFIG.spot*60;R.render(scene,cam)}
led(CONFIG.duration);durIn.value=CONFIG.duration;requestAnimationFrame(loop);
})();
